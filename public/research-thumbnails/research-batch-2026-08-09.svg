  <text x="132" y="492" fill="#9fb6c9" font-family="Arial, sans-serif" font-size="22">SOURCE</text><text x="350" y="492" fill="#9fb6c9" font-family="Arial, sans-serif" font-size="22">OWNER</text><text x="568" y="492" fill="#9fb6c9" font-family="Arial, sans-serif" font-size="22">DATE</text><text x="786" y="492" fill="#9fb6c9" font-family="Arial, sans-serif" font-size="22">NEXT CHECK</text>
</svg>
