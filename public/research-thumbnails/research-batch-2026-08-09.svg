<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Research controls for outsourced account management</title>
  <desc id="desc">A dark blue research report thumbnail with teal evidence lines and an account review grid.</desc>
  <rect width="1200" height="630" fill="#102033"/>
  <circle cx="1030" cy="100" r="220" fill="#0f766e" opacity=".22"/>
  <rect x="84" y="92" width="1032" height="446" rx="24" fill="#17314a" stroke="#4fd1c5" stroke-opacity=".35"/>
  <text x="132" y="190" fill="#8be6dc" font-family="Arial, sans-serif" font-size="24" letter-spacing="4">OUTSOURCED ACCOUNT MANAGEMENT</text>
  <text x="132" y="280" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="700">Research controls</text>
  <text x="132" y="342" fill="#d7e4ef" font-family="Arial, sans-serif" font-size="30">Evidence, ownership, and repeatable review.</text>
  <g fill="none" stroke="#4fd1c5" stroke-width="8" stroke-linecap="round">
    <path d="M138 432h178"/><path d="M356 432h178"/><path d="M574 432h178"/><path d="M792 432h178"/>
  </g>
