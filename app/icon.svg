<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Outsourced Account Management logo</title>
  <desc id="desc">A custom client account portfolio mark with a AM wordmark monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102033"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#102033" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="34" fill="#fff8ee"/>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(16 8) scale(1)">
  <rect x="18" y="24" width="60" height="44" rx="10" fill="#fff8ee"/>
  <circle cx="36" cy="46" r="9" fill="#0f766e"/>
  <path d="M52 39h15M52 51h11" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
  <path d="M24 76c9-8 19-12 31-12s21 4 29 12" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect x="18" y="88" width="92" height="25" rx="12.5" fill="rgba(0,0,0,.24)"/>
  <text x="64" y="106" text-anchor="middle" font-family="Inter, Manrope, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="-.5" fill="#fff8ee">AM</text>
</svg>
